<style>
:root{
  --dark:#212121; --dark2:#383838; --dark3:#2b2b2b; --lime:#ceff00; --gray:#e1e1e1; --off:#ededed;
  --muted:#a8a8a8; --no:#ff7a6b; --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:80px}
body{background:var(--dark);color:var(--off);font-family:Montserrat,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* Header */
header{position:sticky;top:0;z-index:20;background:var(--dark);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:24px;height:64px}
.bar img{height:24px;display:block;flex:none}
nav{display:flex;gap:2px;margin-left:auto}
nav a{text-decoration:none;font-size:13px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:8px;white-space:nowrap}
nav a:hover{color:var(--off);background:var(--dark2)}
.lang{display:flex;flex:none;background:var(--dark2);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px Montserrat,system-ui,sans-serif;letter-spacing:.06em;padding:7px 14px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--lime);color:var(--dark)}
@media (max-width:900px){nav{display:none}.lang{margin-left:auto}}

/* Hero */
.hero{padding:80px 0 64px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin-bottom:18px}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.08;font-weight:800;letter-spacing:-.02em;max-width:820px}
h1 em{font-style:normal;color:var(--lime)}
.lead{font-size:18px;color:var(--gray);max-width:680px;margin-top:22px}
.promise{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.promise div{background:var(--dark3);border:1px solid var(--line);border-radius:16px;padding:20px}
.promise b{display:block;font-size:15px;margin-bottom:4px}
.promise span{font-size:14px;color:var(--muted)}
.cta-row{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--lime);color:var(--dark);font-weight:700;font-size:15px;text-decoration:none;padding:14px 22px;border-radius:999px;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--off);border:1px solid rgba(255,255,255,.25)}
.btn svg{width:18px;height:18px}

/* Sections */
section{padding:72px 0;border-bottom:1px solid var(--line)}
.sec-head{display:flex;gap:20px;align-items:flex-start;margin-bottom:36px}
.num{flex:none;width:44px;height:44px;border-radius:12px;background:var(--lime);color:var(--dark);font-weight:800;display:grid;place-items:center;font-size:16px}
h2{font-size:clamp(24px,3.2vw,34px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
.sec-head p{color:var(--gray);margin-top:8px;max-width:720px}

/* Do / Don't cards */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr));gap:20px}
.pair{background:var(--dark3);border:1px solid var(--line);border-radius:20px;padding:22px}
.pair.wide{grid-column:1/-1}
.pair.wide .vs{max-width:620px;margin:0 auto}
.pair h3{font-size:16px;font-weight:700;margin-bottom:16px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ex{text-align:center}
.ex svg{width:100%;max-width:190px;height:auto;display:block;border-radius:14px;margin:0 auto}
.ex svg[data-scene=horizontal]{max-width:300px}
.ex svg[data-scene^=audience]{max-width:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:10px}
.tag.y{color:var(--lime)} .tag.n{color:var(--no)}
.tag i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--dark)}
.tag.y i{background:var(--lime)} .tag.n i{background:var(--no)}
.ex p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.why{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;color:var(--gray)}
.why b{color:var(--lime);font-weight:700}

/* Tip lists */
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tip{background:var(--dark3);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;gap:14px}
.tip .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--dark2);display:grid;place-items:center}
.tip .ic svg{width:20px;height:20px;stroke:var(--lime);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tip b{display:block;font-size:15px;margin-bottom:3px}
.tip span{font-size:14px;color:var(--muted)}
.tip.no .ic svg{stroke:var(--no)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.list{background:var(--dark3);border:1px solid var(--line);border-radius:20px;padding:24px}
.list h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.list ul{list-style:none;display:grid;gap:10px}
.list li{display:flex;gap:10px;font-size:14.5px;color:var(--gray)}
.list li:before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:9px;background:var(--lime)}
.list.n li:before{background:var(--no)}
.list.n h3{color:var(--no)} .list.y h3{color:var(--lime)}

/* Photo grid */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.shot{background:var(--dark3);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.shot svg{display:block;width:100%;height:auto}
.shot div{padding:16px 18px 18px}
.shot b{display:block;font-size:15px}
.shot span{font-size:13.5px;color:var(--muted)}

/* Checklist */
.check{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.check label{display:flex;gap:12px;align-items:flex-start;background:var(--dark3);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.2s}
.check input{appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #666;margin-top:1px;display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--lime);border-color:var(--lime)}
.check input:checked:after{content:"";width:6px;height:11px;border:solid var(--dark);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check label:has(input:checked){border-color:rgba(206,255,0,.45)}
.check b{display:block;font-size:14.5px}
.check span{font-size:13px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:14px;margin-bottom:18px;font-size:13px;color:var(--muted)}
.progress .track{flex:1;height:6px;background:var(--dark2);border-radius:9px;overflow:hidden}
.progress .fill{height:100%;width:0;background:var(--lime);transition:.3s}
.reset{background:none;border:0;color:var(--muted);font:600 12px Montserrat,system-ui,sans-serif;text-decoration:underline;cursor:pointer}

/* Callout */
.note{margin-top:28px;background:linear-gradient(135deg,rgba(206,255,0,.12),rgba(206,255,0,.02));border:1px solid rgba(206,255,0,.3);border-radius:18px;padding:22px 24px;display:flex;gap:16px;align-items:flex-start}
.note svg{flex:none;width:26px;height:26px;stroke:var(--lime);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note b{display:block;margin-bottom:2px}
.note p{color:var(--gray);font-size:15px}

/* Upload */
.upload{background:var(--lime);color:var(--dark);border-radius:28px;padding:48px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.upload h2{color:var(--dark)}
.upload p{margin-top:12px;font-size:16px;color:#2f2f2f}
.upload .btn{background:var(--dark);color:var(--lime);margin-top:24px}
.steps{list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:rgba(33,33,33,.08);border-radius:14px;padding:14px 16px 14px 54px;position:relative;font-size:14.5px;font-weight:500}
.steps li:before{content:counter(s);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--dark);color:var(--lime);font-weight:800;font-size:13px;display:grid;place-items:center}
.steps code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:rgba(33,33,33,.12);padding:2px 6px;border-radius:6px}

footer{padding:48px 0 64px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer img{height:20px;opacity:.7}

@media (max-width:760px){
  .cols,.upload{grid-template-columns:1fr}
  .upload{padding:32px 24px}
  .hero{padding:56px 0 48px}
  section{padding:56px 0}
  .vs{gap:10px}
}
</style>
</head>

hero_lead:"Thank you for supporting the Comms team with material from events and day-to-day activities. This guide sets out the practices with the greatest impact on final quality. No prior training or professional equipment is required.",

or_t:"Phone orientation",
or_v:"Vertical format: Instagram, LinkedIn, Reels and Stories.",or_h:"Horizontal format: website, presentations and long-form video.",
or_why:"<b>Standard:</b> most Glofy content is published in vertical format. Vertical is the default unless the Comms team requests otherwise. Orientation remains the same for the entire clip.",
f1_t:"Full head within the frame",f1_y:"Space above the head. Eyes aligned with the upper third.",f1_n:"Top of the head or chin cut off at the edge.",
f1_why:"<b>Tip:</b> activate the grid in the camera settings. Align the eyes with the upper horizontal line and leave a small margin above the head.",
f2_t:"Appropriate distance",f2_y:"Chest-up framing. Facial expressions are clearly visible.",f2_n:"The subject appears small and distant.",
f2_why:"<b>Tip:</b> when facial expressions are not visible on screen, two steps closer usually solve it.",
f3_t:"Camera at eye level",f3_y:"The lens is aligned with the subject's eyes.",f3_n:"The camera points upward from below the chin.",
f3_why:"<b>Tip:</b> a shelf, a stack of books or a colleague's help keeps the phone at eye level.",
f4_t:"Clean background",f4_y:"A wall, plants, Glofy branding or an open space.",f4_n:"Clutter, people walking behind, cables or bins.",
f4_why:"<b>Tip:</b> a quick check of the background before recording prevents most distractions. Moving one meter is often enough.",
s3_t:"Lighting",s3_d:"Lighting has the single largest impact on image quality. Natural light and correct positioning are sufficient; no additional equipment is required.",
l1_t:"Light source in front of the subject",l1_y:"The window or main light faces the subject.",l1_n:"A bright window behind the subject creates a silhouette.",
l1_why:"<b>Tip:</b> the subject faces the window, with the camera positioned between the subject and the light.",
l2_t:"Soft, even lighting",l2_y:"Daylight from a window or a well-lit room.",l2_n:"Dark areas or a single hard overhead light.",
l2_why:"<b>Tip:</b> visible grain on screen indicates insufficient light. Moving closer to a window or adding light resolves it.",
l3_t:"Natural light first",l3_d:"Window light is the most flattering option and the first choice whenever available.",

l5_t:"Flash off",l5_d:"Flash flattens features and causes red-eye. Additional ambient light is the preferred alternative.",

a1_t:"Microphone close to the speaker",a1_y:"Phone at approximately one meter, in a quiet area.",a1_n:"Long distance, with music or crowd noise in between.",
a1_why:"<b>Tip:</b> wired earphones with a built-in microphone, or a lapel mic, significantly improve voice clarity. Position the mic close to the mouth without covering it.",

const C={bg:"#2f2f2f",bg2:"#3a3a3a",skin:"#e1e1e1",body:"#8a8a8a",lime:"#ceff00",no:"#ff7a6b",ink:"#212121",grid:"rgba(255,255,255,.16)"};
function person(cx,hy,s,o={}){
  const r=22*s, f=o.face||C.skin, b=o.body||C.body;
  let eyes="";
  if(!o.noface){
    const ey=hy-2*s, dx=o.look==="down"?0:0, dy=o.look==="down"?4*s:0;
    eyes=`<circle cx="${cx-7*s}" cy="${ey+dy}" r="${2.2*s}" fill="${C.ink}"/><circle cx="${cx+7*s}" cy="${ey+dy}" r="${2.2*s}" fill="${C.ink}"/>`+
      (o.smile===false?"":`<path d="M${cx-6*s} ${hy+8*s} q${6*s} ${5*s} ${12*s} 0" stroke="${C.ink}" stroke-width="${1.8*s}" fill="none" stroke-linecap="round"/>`);
  }
  return `<path d="M${cx-48*s} ${hy+r+70*s} q0 -${46*s} ${48*s} -${48*s} q${48*s} ${2*s} ${48*s} ${48*s} z" fill="${b}"/>`+
    `<rect x="${cx-7*s}" y="${hy+r-6*s}" width="${14*s}" height="${12*s}" fill="${f}"/>`+
    `<circle cx="${cx}" cy="${hy}" r="${r}" fill="${f}"/>`+
    `<path d="M${cx-r} ${hy-4*s} q${r} -${r*1.6} ${2*r} 0 q-${2*s} -${r*1.25} -${r} -${r*1.2} q-${r-2*s} 0 -${r} ${r*1.2}z" fill="${o.hair||'#555'}"/>`+eyes;
}
function back(cx,hy,s){const r=20*s;return `<path d="M${cx-40*s} ${hy+r+60*s} q0 -${40*s} ${40*s} -${42*s} q${40*s} ${2*s} ${40*s} ${42*s} z" fill="#6c6c6c"/><circle cx="${cx}" cy="${hy}" r="${r}" fill="#555"/>`;}
function grid(w,h,x=0,y=0){return `<g stroke="${C.grid}" stroke-width="1"><line x1="${x+w/3}" y1="${y}" x2="${x+w/3}" y2="${y+h}"/><line x1="${x+2*w/3}" y1="${y}" x2="${x+2*w/3}" y2="${y+h}"/><line x1="${x}" y1="${y+h/3}" x2="${x+w}" y2="${y+h/3}"/><line x1="${x}" y1="${y+2*h/3}" x2="${x+w}" y2="${y+2*h/3}"/></g>`;}
function phone(inner,o={}){
  const w=o.h?300:170,h=o.h?170:300,id="c"+Math.random().toString(36).slice(2,8);
  const bc=o.bad?C.no:(o.good?C.lime:"#555");
  return {vb:`0 0 ${w+20} ${h+20}`,svg:`<defs><clipPath id="${id}"><rect x="10" y="10" width="${w}" height="${h}" rx="14"/></clipPath></defs>
  <rect x="4" y="4" width="${w+12}" height="${h+12}" rx="19" fill="#151515" stroke="${bc}" stroke-width="2"/>
  <g clip-path="url(#${id})"><rect x="10" y="10" width="${w}" height="${h}" fill="${o.bg||C.bg}"/>${inner}${o.nogrid?"":grid(w,h,10,10)}</g>`};
}
function photoCard(inner){const id="p"+Math.random().toString(36).slice(2,8);return {vb:"0 0 320 200",svg:`<defs><clipPath id="${id}"><rect width="320" height="200"/></clipPath></defs><g clip-path="url(#${id})"><rect width="320" height="200" fill="${C.bg}"/>${inner}</g>`};}
function sun(x,y,r,c="#fff4b8"){let rays="";for(let i=0;i<8;i++){const a=i*Math.PI/4;rays+=`<line x1="${x+Math.cos(a)*(r+4)}" y1="${y+Math.sin(a)*(r+4)}" x2="${x+Math.cos(a)*(r+10)}" y2="${y+Math.sin(a)*(r+10)}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;}return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>${rays}`;}
function plant(x,y,s=1){return `<rect x="${x-10*s}" y="${y}" width="${20*s}" height="${22*s}" rx="3" fill="#6b6b6b"/><path d="M${x} ${y} q-22 -20 -14 -44 q10 16 14 44 q4 -30 18 -40 q4 22 -18 40" fill="#7d9a00"/>`;}

 "ph-people":()=>photoCard(person(110,80,.95)+person(210,85,.95,{hair:"#3e3e3e"})+`<path d="M150 150 l20 0" stroke="${C.skin}" stroke-width="10" stroke-linecap="round"/>`),
 "ph-speaker":()=>photoCard(`<rect x="150" y="18" width="150" height="90" rx="4" fill="#4a4a4a"/><rect x="164" y="34" width="70" height="8" fill="${C.lime}"/><rect x="164" y="50" width="110" height="5" fill="#666"/><rect x="164" y="60" width="90" height="5" fill="#666"/>`+person(90,75,.85)+back(220,175,.55)+back(290,180,.55)),
 "ph-detail":()=>photoCard(`<rect width="320" height="200" fill="#333"/><g transform="rotate(-8 160 100)"><rect x="95" y="40" width="130" height="110" rx="10" fill="${C.off||'#ededed'}"/><rect x="95" y="40" width="130" height="30" rx="10" fill="${C.lime}"/><rect x="95" y="58" width="130" height="12" fill="${C.lime}"/><circle cx="160" cy="98" r="16" fill="#bbb"/><rect x="125" y="122" width="70" height="7" rx="3" fill="#999"/><rect x="155" y="20" width="10" height="24" fill="#555"/></g>`),
 "ph-group":()=>photoCard([50,100,150,200,250].map(x=>person(x+10,85,.55)).join("")+[75,125,175,225].map(x=>person(x+10,120,.6)).join("")),
 "ph-candid":()=>photoCard(person(120,80,.9)+person(230,95,.8,{hair:"#3b3b3b"})+`<rect x="160" y="150" width="40" height="30" rx="4" fill="#5a5a5a"/><path d="M200 158 q12 2 8 14" stroke="#5a5a5a" stroke-width="4" fill="none"/>`)
};
function waves(x,y,c){return `<g stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M${x} ${y} q8 10 0 20"/><path d="M${x+8} ${y-6} q12 16 0 32"/></g>`;}
function notes(){return `<g fill="#9a9a9a"><circle cx="70" cy="80" r="5"/><rect x="74" y="58" width="2.5" height="22"/><circle cx="120" cy="95" r="5"/><rect x="124" y="73" width="2.5" height="22"/></g>`;}
function noise(){let s="";for(let i=0;i<160;i++){s+=`<rect x="${10+Math.random()*170}" y="${10+Math.random()*300}" width="2" height="2" fill="#fff" opacity="${(Math.random()*.25).toFixed(2)}"/>`;}return s;}
function pixels(){let s="";const sz=17;for(let y=10;y<310;y+=sz){for(let x=10;x<180;x+=sz){const dx=(x+sz/2-95)/26.4,dy=(y+sz/2-115)/26.4;let col="#353535";if(dx*dx+dy*dy<1)col="#d6d6d6";else if(y>140){const w=Math.max(0,(y-140)*0.6+20);if(Math.abs(x+sz/2-95)<w+30)col="#848484";}
 s+=`<rect x="${x}" y="${y}" width="${sz}" height="${sz}" fill="${col}"/>`;}}return s;}
function render(){document.querySelectorAll("svg[data-scene]").forEach(el=>{const f=S[el.dataset.scene];if(!f)return;const r=f();el.setAttribute("viewBox",r.vb);el.innerHTML=r.svg;el.setAttribute("role","img");});}

/* ===== I18N ===== */
let lang="en";
function setLang(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[l][el.dataset.i];if(typeof v==="string")el.innerHTML=v;});
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===l));
  updateDrive();
  try{localStorage.setItem("gcg_lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

/* ===== DRIVE LINK ===== */
function updateDrive(){
  const ok=/^https?:\/\//.test(DRIVE_URL);
  document.querySelectorAll("#upload .drive-link").forEach(a=>{
    if(ok){a.href=DRIVE_URL;a.style.opacity=1;a.style.pointerEvents="auto";}
    else{a.removeAttribute("href");a.style.opacity=.55;a.style.pointerEvents="none";a.querySelector("span").textContent=T[lang].drive_missing;}
  });
}

render();
let saved="en";try{saved=localStorage.getItem("gcg_lang")||"en"}catch(e){}
setLang(saved==="es"?"es":"en");
</script>
